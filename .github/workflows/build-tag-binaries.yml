name: Build Tagged Binaries

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies and builder
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt pyinstaller

      - name: Build main executable
        run: |
          pyinstaller \
            --onefile \
            --name secure-fs \
            --paths src \
            src/main.py

      - name: Build admin setup executable
        run: |
          pyinstaller \
            --onefile \
            --name secure-fs-admin-setup \
            --paths src \
            src/scripts/create_admin.py

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: secure-fs-binaries-${{ github.ref_name }}
          path: |
            dist/secure-fs
            dist/secure-fs-admin-setup
          if-no-files-found: error

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/secure-fs
            dist/secure-fs-admin-setup