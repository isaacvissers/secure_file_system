repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml

-   repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
    -   id: isort
        args: ["--profile", "black"]
        files: \.py$

-   repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
    -   id: black
        language_version: python3.14
        files: \.py$

-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
